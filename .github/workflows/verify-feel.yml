name: Verify game feel
on:
  push:
    branches: [feature/game-feel]
    paths:
      - .github/workflows/verify-feel.yml
      - tools/feel-*.py
      - scripts/**
      - tests/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply reviewed changes to the restored source
        run: |
          if ! grep -q "version:'1.1.0'" src/engine.mjs; then
            python tools/feel-engine.py
            python tools/feel-ui.py
          fi
      - name: Build and run regression tests
        run: |
          npm run build
          npm test
      - name: Prepare isolated browser verification environment
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify WebGL, feedback, story retry and mobile controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-check/node_modules/playwright
          QA_DIR: ${{ runner.temp }}/moonlit-qa
        run: node scripts/browser-check.cjs
      - name: Record the tested readable source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Improve combat feedback, fair rewards, readability and instant spell retry'
            git push origin HEAD:feature/game-feel
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-feel-verification
          path: |
            ${{ runner.temp }}/moonlit-qa
            dist/index.html
          retention-days: 3
