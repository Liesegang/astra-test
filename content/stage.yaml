# 月影異聞 — 1ファイルで物語と弾幕を編集できます。
# 時間: 秒 / 距離: px / 角度: 度（0=右、90=下）
# 式: t=経過秒, k=発射回数, i=弾番号, n=弾数, rank=難易度
version: 1
meta:
  title: 月影異聞
  subtitle: 月が隠した、もうひとつの夜。
  stage: 花の降る参道
  seed: 7319

player:
  speed: 260
  focusSpeed: 105
  hitRadius: 2.5
  lives: 3
  bombs: 3
  damage: 7

# 基本は every・count・spread・speed だけ。
# 複数の emitters を重ねると複合弾幕になります。
patterns:
  petals:
    name: 花符「六花の軌跡」
    description: 六本の花びらが、ゆっくりと夜にほどける。
    params: {speed: 100, petals: 6}
    emitters:
      - every: 0.09
        count: petals
        spread: 360
        angle: k * 7.5
        speed: (speed + 16 * sin(k * 0.18)) * rank
        turn: 7
        color: pink
        shape: rice
        size: 9
        hitRadius: 3

  stardust:
    name: 星符「きらめく道標」
    description: 自機を狙う五方向弾。大きく動かず、横に避ける。
    emitters:
      - every: 0.85
        count: 5
        aim: player
        spread: 40
        speed: 138 * rank
        color: gold
        shape: diamond
        size: 8
        hitRadius: 2.8

  moon:
    name: 月符「鏡の向こうの満月」
    description: 逆向きに回る二つの輪。その重なりに道を見つける。
    params: {speed: 98}
    emitters:
      - every: 0.3
        count: 28
        angle: k * 11
        spread: 360
        speed: speed * rank
        color: ice
        shape: orb
        size: 8
        hitRadius: 2.8
      - every: 0.3
        delay: 0.15
        count: 28
        angle: -k * 11
        spread: 360
        speed: speed * 0.86 * rank
        color: violet
        shape: rice
        size: 8
        hitRadius: 2.5

  spiral:
    name: 風符「夜渡りの螺旋」
    description: 二重らせんと自機狙い。色ごとに違う流れを読む。
    emitters:
      - every: 0.07
        count: 4
        angle: k * 13
        spread: 360
        speed: 126 * rank
        color: ice
        shape: rice
        size: 10
        hitRadius: 2.6
      - every: 0.95
        count: 9
        aim: player
        spread: 75
        speed: 105 * rank
        color: pink
        shape: orb
        size: 8
        hitRadius: 2.8

  blossom:
    name: 散花（分裂用）
    description: 他の弾が呼び出す、単発の小さな全周弾。
    emitters:
      - every: 1
        times: 1
        count: 10
        spread: 360
        angle: 18
        speed: 75 * rank
        color: gold
        shape: rice
        size: 7
        hitRadius: 2.4

  lanterns:
    name: 灯符「ほどける願い」
    description: 灯りが止まり、十枚の花びらに分かれる。
    emitters:
      - every: 1.5
        count: 7
        spread: 150
        angle: 90 + 18 * sin(k)
        speed: 120 * rank
        accel: -50
        color: pink
        shape: orb
        size: 13
        hitRadius: 4
        on:
          after: 1.3
          fire: blossom
          vanish: true

  finale:
    name: 秘符「月影万華鏡」
    description: 波打つ花の輪と、まっすぐな星の列。
    emitters:
      - every: 0.23
        count: 30
        angle: k * 6
        spread: 360
        speed: (94 + 24 * sin(i / n * tau * 5 + k * 0.3)) * rank
        color: pink
        shape: rice
        size: 9
        hitRadius: 2.8
      - every: 1.2
        count: 7
        aim: player
        spread: 54
        speed: 165 * rank
        color: gold
        shape: diamond
        size: 9
        hitRadius: 2.7

enemies:
  fairy:
    hp: 28
    radius: 16
    score: 500
    color: pink
    patterns: [stardust]
  blue_fairy:
    hp: 42
    radius: 18
    score: 750
    color: ice
    patterns:
      - use: petals
        with: {speed: 82, petals: 3}

bosses:
  sakuya:
    name: 朔夜
    title: 忘れられた灯りの守り手
    color: violet
    move:
      x: 240 + 90 * sin(t * 0.7)
      y: 118 + 20 * sin(t * 0.5)
    phases:
      - name: 花符「六花の軌跡」
        hp: 1300
        duration: 28
        patterns: [petals]
      - name: 月符「鏡の向こうの満月」
        hp: 1450
        duration: 30
        patterns: [moon]
      - name: 灯符「ほどける願い」
        hp: 1500
        duration: 28
        patterns: [lanterns, stardust]
      - name: 秘符「月影万華鏡」
        hp: 1800
        duration: 35
        patterns: [finale]

# wave は非同期で敵を並べ、wait で次のイベントまで待ちます。
# dialogue と boss は、終了するまで次の行に進みません。
story:
  - dialogue:
      - speaker: 小夜
        text: 満月の夜なのに、誰も帰ってこない。\nこの花びらは……山の上から？
      - speaker: 灯火
        text: 灯りを追いかけて。\n忘れられた願いが、まだあそこで待っている。
  - title:
      text: 第一夜
      subtitle: 花の降る参道
      duration: 2.5
  - wave:
      enemy: fairy
      count: 6
      interval: 0.65
      x: 55 + i * 73
      y: -25
      vx: 12 * sin(i * 2)
      vy: 63
  - wait: 6
  - wave:
      enemy: blue_fairy
      count: 4
      interval: 1
      x: 75 + i * 110
      y: -25
      vx: 0
      vy: 45
  - wait: 8
  - wave:
      enemy: fairy
      count: 8
      interval: 0.45
      x: 420 - i * 50
      y: -25
      vx: -12
      vy: 75
  - wait: 8
  - clear: true
  - dialogue:
      - speaker: 朔夜
        text: ここは、忘れた願いが帰り着く場所。\nあなたにも、置いていったものがあるでしょう？
      - speaker: 小夜
        text: あるかもしれない。でも今夜は、\n誰かの「帰りたい」を迎えに来たの。
      - speaker: 朔夜
        text: ならば、この灯りの中を通っておいで。
  - boss: sakuya
  - dialogue:
      - speaker: 朔夜
        text: ……ああ。まだ、覚えていてくれたのね。
      - speaker: 小夜
        text: 夜は終わるよ。\n帰ろう、灯りが消えないうちに。
  - end: true
