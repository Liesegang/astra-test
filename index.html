<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <title>月影異聞 — Moonlit Archive</title>
  <style>html,body{margin:0;background:#0b0d17;color:#eeedf5;font-family:system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center}.loading{opacity:.65;font-size:13px;letter-spacing:.08em}</style>
</head>
<body>
  <div class="loading">月影異聞を読み込んでいます…</div>
  <script type="module">
    const parts = Array.from({length:8}, (_, i) => `assets/game-${i + 1}.b64`);
    try {
      if (!('DecompressionStream' in globalThis)) throw new Error('DecompressionStream is not supported by this browser.');
      const chunks = await Promise.all(parts.map(async path => {
        const r = await fetch(path, {cache:'no-cache'});
        if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
        return (await r.text()).trim();
      }));
      const b64 = chunks.join('');
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.innerHTML = `<pre style="white-space:pre-wrap;max-width:720px;padding:24px">起動に失敗しました。\n${String(error?.message ?? error)}</pre>`;
      console.error(error);
    }
  </script>
</body>
</html>
